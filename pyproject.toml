[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "smart-tagging"
version = "0.1.0"
description = "AI smart tagging for fashion e-commerce catalogs"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "José David Zamudio" }]

# Base dependencies: what the package needs to be imported and to move data
# around. Deliberately small; it grows as modules land, not in anticipation.
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "pyyaml>=6.0",
    # Experiment tracking runs wherever the pipeline runs, Kaggle included, so
    # it is a base dependency. Imported lazily inside functions all the same.
    "mlflow>=2.14",
]

[project.optional-dependencies]
# Heavy runtimes, deliberately NOT base dependencies.
#
# On Kaggle torch is already installed and compiled against that session's CUDA
# build. If this package declared torch as a base dependency, installing it there
# would re-resolve torch and can silently swap in a CPU wheel: correct results,
# forty times slower, no error. The environment owns torch, not this package.
#
# Local:  uv sync --extra local
# Kaggle: install without the extra; the preinstalled torch is left alone.
# CI:     installs neither, which is what keeps the import graph honest.
local = [
    # Upper bound is an environment finding, not a preference. On this Windows
    # machine torch 2.9.0 and 2.14.0 fail at import with
    # `OSError [WinError 1114]` loading c10.dll — the DLL is found but its
    # initialisation routine fails. Ruled out: missing MSVC runtimes (all
    # present), CPU instruction sets (i7-1255U has AVX2/FMA3), and a corrupt
    # wheel (reinstall changed nothing). 2.7.0 imports cleanly, 2.9.0 does not.
    #
    # This only constrains local work — export to ONNX and small experiments.
    # The heavy steps run on Kaggle against that session's own torch, which is
    # precisely why torch is not a base dependency. Revisit when F0.9 measures
    # ONNX/OpenVINO latency, where a version gap against Kaggle could matter.
    "torch>=2.7,<2.8",
    "torchvision>=0.22,<0.23",
    "onnx>=1.16",
    "onnxruntime>=1.18",
    "openvino>=2024.0",
]

[dependency-groups]
dev = [
    "ruff==0.16.8",  # pinned: must match the rev in .pre-commit-config.yaml
    "pytest>=8.0",
    "pre-commit>=3.7",
    # Needed as a real dependency, not only as a pre-commit hook: the Git clean
    # filter installed by `nbstripout --install` invokes this interpreter.
    "nbstripout>=0.7",
    # A command-line tool, never imported by this package, so it belongs here
    # rather than among the runtime dependencies.
    "dvc>=3.50",
]

[tool.hatch.build.targets.wheel]
packages = ["src/smart_tagging"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
# Minimal set on purpose: pycodestyle errors and pyflakes. Rule families are
# added deliberately when there is a reason, never inherited by accident.
select = ["E", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
